<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#959cff"/>
      <stop offset="1" stop-color="#6d5cff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe680"/>
      <stop offset="1" stop-color="#ffd54a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#2a1a8a" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- Tile (macOS-style safe area: 100px margin) -->
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#tile)"/>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#shine)"/>

  <g filter="url(#shadow)">
    <!-- Back card with green tab -->
    <path d="M300 300 h336 a16 16 0 0 0 14-8 l14-28 a24 24 0 0 1 21-13 h69 a26 26 0 0 1 26 26 v410 H300 a26 26 0 0 1-26-26 V326 a26 26 0 0 1 26-26z" fill="#f3a947"/>
    <path d="M664 264 a24 24 0 0 1 21-13 h69 a26 26 0 0 1 26 26 v23 h-130 z" fill="#7cc04a"/>
    <!-- Middle card with blue tab -->
    <path d="M300 372 h170 l18-44 a22 22 0 0 1 20-14 h104 a22 22 0 0 1 20 14 l18 44 h75 a26 26 0 0 1 26 26 v330 H300 a26 26 0 0 1-26-26 V398 a26 26 0 0 1 26-26z" fill="#ffc72c"/>
    <path d="M508 314 h104 a22 22 0 0 1 20 14 l18 44 H470 l18-44 a22 22 0 0 1 20-14z" fill="#1e8fe0"/>
    <!-- Front folder with red tab -->
    <path d="M300 430 h118 a22 22 0 0 1 20 13 l14 30 h296 a26 26 0 0 1 26 26 v250 a26 26 0 0 1-26 26 H300 a26 26 0 0 1-26-26 V456 a26 26 0 0 1 26-26z" fill="url(#front)"/>
    <path d="M300 430 h118 a22 22 0 0 1 20 13 l14 30 H274 v-17 a26 26 0 0 1 26-26z" fill="#f2523b"/>
    <!-- Subtle lines suggesting widgets -->
    <rect x="330" y="540" width="200" height="22" rx="11" fill="#c9950f" opacity=".35"/>
    <rect x="330" y="590" width="360" height="22" rx="11" fill="#c9950f" opacity=".25"/>
    <rect x="330" y="640" width="280" height="22" rx="11" fill="#c9950f" opacity=".25"/>
  </g>
</svg>
