name: Build and publish Docker image

# Publishes a container image to GitHub Container Registry (GHCR) so it can be
# pulled directly — e.g. as a Portainer stack — without building on the host.
#   - every push to main      → :latest and :sha-<commit>
#   - every release (called from release.yml with its tag, e.g. v0.3.6)
#                              → :0.3.6, :0.3 and :v0.3.6
#   - Actions → Run workflow  → optionally enter an existing tag to (re)publish it
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag to build and publish, e.g. v0.3.6 (leave empty to build the selected branch)'
        required: false
  workflow_call:
    inputs:
      version:
        description: 'Release tag, e.g. v0.3.6'
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the image name for GHCR automatically.
          images: ghcr.io/${{ github.repository }}
          # Branch builds: latest + sha. Release builds: 0.3.6, 0.3 and v0.3.6.
          tags: |
            type=raw,value=latest,enable=${{ !inputs.version && github.ref == 'refs/heads/main' }}
            type=sha,format=short,enable=${{ !inputs.version }}
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ !!inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ !!inputs.version }}
            type=raw,value=${{ inputs.version }},enable=${{ !!inputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
