name: Desktop release

# Publish desktop installers, either way:
#   - push a version tag:   git tag v0.2.0 && git push origin v0.2.0
#   - or Actions → "Desktop release" → Run workflow, enter v0.2.0 (the tag is
#     created on the branch you pick if it doesn't exist yet)
# Builds Windows (.exe), macOS (.dmg, Intel + Apple Silicon) and Linux
# (.AppImage) on GitHub's machines and attaches them — plus the update metadata
# the in-app Update button reads — to a GitHub Release for that tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag, e.g. v0.2.0 — created from the selected branch if it does not exist'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release (and the tag, for manual runs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "Tag must look like v1.2.3, got '$TAG'"; exit 1 ;; esac
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" --title "HomeDash $TAG" --generate-notes

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Use the tag as the app version
        shell: bash
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      - name: Build the web app
        run: |
          npm ci
          npm run build

      - name: Build and publish installers
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned for now. To sign later, add CSC_LINK / CSC_KEY_PASSWORD
          # (and APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID for
          # macOS notarization) as repository secrets and remove this line.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          npm run release
